name: Build APK & Release

# 打 tag（v*）→ 自动编译并发布 Release，APK 作为附件
# 也可以手动触发：Actions -> Build APK & Release -> Run workflow
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布成 Release 的 tag，例如 v1.0.7.4。留空则只编译并上传 artifact。'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 - AGP 8.11.1 需要 JDK 17+，21 是 LTS 且与本地一致
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 从 build.gradle 读 versionName，保证产物名与版本一致
      - name: Rename APK
        id: apk
        run: |
          set -e
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            LABEL="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            LABEL="${{ github.ref_name }}"
          else
            LABEL="v${VERSION}-build.${{ github.run_number }}"
          fi

          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/XuanFeng-${LABEL}.apk"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -l out

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: XuanFeng-apk-${{ steps.apk.outputs.label }}
          path: out/*.apk
          if-no-files-found: error

      # 只在 tag 推送 / 手动指定 tag 时发布 Release
      - name: Create GitHub Release
        if: github.ref_type == 'tag' || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: XuanFeng ${{ steps.apk.outputs.label }}
          files: out/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Summarise
        run: |
          {
            echo "### XuanFeng build"
            echo ""
            echo "- version: \`${{ steps.apk.outputs.version }}\`"
            echo "- label: \`${{ steps.apk.outputs.label }}\`"
            echo "- APK: \`out/XuanFeng-${{ steps.apk.outputs.label }}.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
